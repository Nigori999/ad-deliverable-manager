<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智驾中心交付物管理系统</title>
  <link rel="stylesheet" href="/css/styles.css?v=0.7.0">
  <link rel="stylesheet" href="/css/v070.css?v=0.7.0">
</head>
<body>
  <div id="auth-root"></div>
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AD</div>
        <div><strong>交付物管理</strong><span>智驾中心</span></div>
      </div>
      <nav>
        <a href="#/dashboard" data-route="dashboard"><span>◫</span>仪表盘</a>
        <a href="#/deliverables" data-route="deliverables"><span>▤</span>交付物台账</a>
        <a href="#/changes" data-route="changes"><span>↻</span>变更管理</a>
        <a href="#/analytics" data-route="analytics"><span>◩</span>完整度分析</a>
        <a href="#/users" data-route="users" data-role="ADMIN"><span>♙</span>用户管理</a>
        <a href="#/settings" data-route="settings"><span>⚙</span>基础设置</a>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span>SQLite本地运行</div>
    </aside>

    <div class="workspace">

        <div><h1 id="page-title">仪表盘</h1><p id="page-subtitle">统一管理交付物、版本和变更记录</p></div>
        <div class="topbar-actions">
          <div class="user-chip"><strong id="current-user-name">—</strong><span id="current-user-role">—</span></div>
          <button class="btn btn-light" type="button" id="change-password">修改密码</button>
          <button class="btn btn-light" type="button" id="global-refresh">刷新</button>
          <button class="btn btn-light" type="button" id="logout-button">退出</button>
        </div>
      </header>
      <main id="app-content" class="content"><div class="loading">正在加载…</div></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script src="/js/core.js?v=0.7.0"></script>
  <script src="/js/auth.js?v=0.7.0"></script>
  <script src="/js/dashboard.js?v=0.7.0"></script>
  <script src="/js/deliverables-list.js?v=0.7.0"></script>
